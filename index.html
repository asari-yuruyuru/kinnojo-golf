<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#102d26" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ゴルフ戦略" />
    <title>ゴルフ ティーショット戦略</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <p class="eyebrow">TEE SHOT STRATEGY</p>
        <h1 id="courseTitle">鬼ノ城ゴルフ倶楽部</h1>
        <label class="course-picker-label">コース選択
          <select id="coursePicker" aria-label="ゴルフコース選択"></select>
        </label>
        <div id="v4RoundStatus" class="v4-round-status" hidden></div>
        <p id="courseLabel" class="course-label">OUT COURSE</p>
        <button id="settingsButton" class="data-verification-button" type="button">設定 / 開発</button>
      </header>

      <div id="playSurface">
      <section class="control-section" aria-labelledby="hole-selector-title">
        <div id="courseSelector" class="course-selector" role="group" aria-label="OUT・INコース切り替え"></div>
        <div class="section-heading">
          <h2 id="hole-selector-title">9ホール戦略一覧</h2>
          <span id="holeProgress" class="progress-label">OUT 9ホール</span>
        </div>
        <div id="holeSelector" class="hole-selector" role="group" aria-label="ホール選択" hidden></div>
      </section>

      <section class="control-section tee-section" aria-labelledby="tee-selector-title">
        <h2 id="tee-selector-title">使用ティー</h2>
        <div id="teeSelector" class="tee-selector" role="radiogroup" aria-label="使用ティーの選択"></div>
      </section>

      <section id="strategyCard" class="strategy-card" aria-live="polite"></section>
      </div>
      <section id="verificationScreen" class="verification-screen" hidden aria-live="polite"></section>
      <section id="developerScreen" class="developer-screen" hidden aria-live="polite"></section>
    </main>

    <nav class="bottom-nav" aria-label="ホール移動" hidden>
      <button id="previousButton" class="nav-button" type="button" aria-label="前のホールへ">‹<span>前のホール</span></button>
      <button id="nextButton" class="nav-button nav-button-primary" type="button" aria-label="次のホールへ"><span>次のホール</span>›</button>
    </nav>

    <script src="v4-storage.js"></script>
    <script src="app.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./service-worker.js").catch((error) => {
            console.error("Service Worker registration failed:", error);
          });
        });
      }
    </script>
  </body>
</html>
